<div id="preloader"
  class="fixed inset-0 bg-[#0c0a09] flex items-center justify-center z-[100] transition-all duration-700 ease-in-out overflow-hidden">

  <!-- Aurora Gradients -->
  <div class="absolute inset-0 pointer-events-none">
    <div
      class="absolute top-[-10%] left-[-10%] w-[50vw] h-[50vw] bg-cyan-500/10 rounded-full blur-[120px] animate-pulse-slow">
    </div>
    <div
      class="absolute bottom-[-10%] right-[-10%] w-[50vw] h-[50vw] bg-blue-500/10 rounded-full blur-[120px] animate-pulse-slow delay-700">
    </div>
  </div>

  <div class="relative flex flex-col items-center gap-12">

    <!-- Premium Logo Display -->
    <div class="relative group">
      <div
        class="absolute inset-0 bg-cyan-500/10 rounded-full blur-3xl animate-pulse group-hover:bg-cyan-500/20 transition-all duration-500">
      </div>
      <img src="assets/SA.png" alt="Logo" id="preloader-logo"
        class="relative w-40 h-40 md:w-56 md:h-56 object-contain animate-float drop-shadow-[0_0_20px_rgba(6,182,212,0.3)]">
    </div>

    <!-- Loading Info Card -->
    <div
      class="glass-panel px-8 py-4 rounded-full border border-white/10 backdrop-blur-md flex items-center gap-6 animate-fade-in-up">
      <div class="flex items-center gap-3">
        <div class="w-2 h-2 rounded-full bg-cyan-500 animate-ping"></div>
        <span class="text-white font-outfit font-bold text-2xl tracking-widest min-w-[70px]"
          id="loading-percentage">0%</span>
      </div>
      <div class="h-6 w-[1px] bg-white/10"></div>
      <span class="text-gray-400 font-inter text-[10px] uppercase tracking-[0.4em] font-bold">Synthesizing</span>
    </div>

  </div>
</div>

<div class="flex flex-col min-h-screen bg-stone-900">
  <app-navbar [isLoading]="isLoading"></app-navbar>

  <div class="flex-grow">
    <router-outlet></router-outlet>
    <div id="profile" *ngIf="showProfile">
      <app-dashboard></app-dashboard>
    </div>

    <div id="skills">
      <app-skills></app-skills>
    </div>
    <div id="works">
      <app-works></app-works>
    </div>
    <div id="expertise">
      <app-expertise></app-expertise>
    </div>
    <div id="contact">
      <app-contact></app-contact>
    </div>
  </div>
  <app-chatbot [isLoading]="isLoading"></app-chatbot>
</div>
