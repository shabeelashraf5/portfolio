<div *ngIf="!isLoading" class="z-50 relative">
  <!-- Modern Floating Toggle Button -->
  <button (click)="toggleChatbox()" type="button"
    class="fixed bottom-6 right-6 md:bottom-8 md:right-8 group flex items-center gap-3 px-6 py-3 bg-black/40 backdrop-blur-xl border border-cyan-500/30 rounded-full text-white shadow-[0_0_30px_rgba(6,182,212,0.1)] hover:shadow-[0_0_40px_rgba(6,182,212,0.2)] hover:border-cyan-500/50 transition-all duration-500 animate-fade-in">
    <div class="relative w-6 h-6 flex items-center justify-center">
      <svg class="w-6 h-6 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
      </svg>
      <span class="absolute -top-1 -right-1 flex h-2 w-2">
        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-cyan-400 opacity-75"></span>
        <span class="relative inline-flex rounded-full h-2 w-2 bg-cyan-500"></span>
      </span>
    </div>
    <span class="font-outfit text-[11px] font-bold tracking-[0.2em] uppercase">Ask Bot</span>

    <svg class="w-4 h-4 text-cyan-400 transition-transform duration-500" [class.rotate-180]="isChatboxVisible"
      fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m5 15 7-7 7 7" />
    </svg>
  </button>

  <!-- Modern Glass Chatbox -->
  <div *ngIf="isChatboxVisible"
    class="fixed bottom-24 right-6 md:bottom-28 md:right-8 w-[90vw] md:w-96 h-[500px] md:h-[600px] bg-black/40 backdrop-blur-2xl border border-cyan-500/30 rounded-3xl shadow-[0_30px_60px_rgba(0,0,0,0.5)] flex flex-col overflow-hidden animate-slide-up">
    <!-- Chat Header -->
    <div class="p-6 border-b border-white/5 bg-white/5 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-cyan-500/10 flex items-center justify-center border border-cyan-500/20">
          <span class="text-xs font-bold text-cyan-400 font-outfit">Bot</span>
        </div>
        <div>
          <h4 class="text-white font-outfit font-bold text-sm tracking-wide">sHAbEel's Bot Assistant</h4>
          <span class="text-[10px] text-cyan-400 font-inter uppercase tracking-widest font-bold">Online</span>
        </div>
      </div>
      <div class="flex items-center gap-4">
        <button (click)="refreshChatbox()" class="text-gray-400 hover:text-white transition-colors p-1">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
        </button>
        <button (click)="closeChatbox()"
          class="text-gray-400 hover:text-white transition-colors text-2xl font-light">&times;</button>
      </div>
    </div>

    <!-- Messages Area -->
    <div #scrollContainer class="flex-1 p-6 overflow-y-auto space-y-6 relative custom-scrollbar">
      <!-- Subtle Brand Anchor -->
      <div class="absolute inset-0 flex items-center justify-center opacity-[0.03] pointer-events-none">
        <img src="assets/SA.png" alt="Branding" class="w-48 h-48 object-contain grayscale" />
      </div>

      <!-- Message Loops -->
      <div *ngFor="let chat of chatMessages" class="flex flex-col" [class.items-end]="chat.sender === 'User'">
        <span class="text-[10px] uppercase tracking-widest font-bold mb-2 transition-all"
          [class.text-cyan-400]="chat.sender !== 'User'" [class.text-gray-500]="chat.sender === 'User'">
          {{ chat.sender }}
        </span>
        <div class="max-w-[85%] p-4 rounded-2xl font-inter text-sm leading-relaxed transition-all"
          [ngClass]="chat.sender !== 'User' ? 'bg-cyan-500/10 text-white border border-cyan-500/20' : 'bg-white/5 text-gray-300'">
          {{ chat.message }}
        </div>
      </div>

      <!-- Typing Indicator -->
      <div *ngIf="isTyping" class="flex flex-col items-start">
        <span class="text-[10px] text-cyan-400 uppercase tracking-widest font-bold mb-2">sHabEel Bot</span>
        <div class="bg-cyan-500/10 border border-cyan-500/20 p-4 rounded-2xl flex gap-1">
          <span class="w-1.5 h-1.5 bg-cyan-400 rounded-full animate-bounce"></span>
          <span class="w-1.5 h-1.5 bg-cyan-400 rounded-full animate-bounce [animation-delay:0.2s]"></span>
          <span class="w-1.5 h-1.5 bg-cyan-400 rounded-full animate-bounce [animation-delay:0.4s]"></span>
        </div>
      </div>
      <!-- Choice Tiles / Suggestions -->
      <div *ngIf="displayedQuestions.length > 0 && !isTyping" class="flex flex-wrap gap-2 pt-2">
        <button *ngFor="let question of displayedQuestions" (click)="sendMessage(question)"
          class="px-3 py-1.5 glass-panel text-left rounded-full hover:bg-white/5 hover:border-cyan-500/40 group transition-all duration-300">
          <span class="text-[10px] text-gray-400 group-hover:text-cyan-100 font-inter">{{ question }}</span>
        </button>
      </div>
    </div>

    <!-- Free-Text Input Area -->
    <div class="p-6 bg-black/40 border-t border-white/5">
      <form (ngSubmit)="sendMessage(message)" class="relative flex items-center gap-3">
        <input type="text" [(ngModel)]="message" name="chatInput" placeholder="Ask Shabeel anything..."
          class="w-full bg-white/5 border border-white/10 rounded-2xl px-4 py-3 text-sm text-white focus:outline-none focus:border-cyan-500/50 focus:ring-1 focus:ring-cyan-500/20 placeholder-gray-500 transition-all font-inter" />
        <button type="submit" [disabled]="!message.trim()"
          class="absolute right-2 p-2 text-cyan-500 hover:text-cyan-400 disabled:text-gray-600 transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7" />
          </svg>
        </button>
      </form>
    </div>
  </div>
</div>
