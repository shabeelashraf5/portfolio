<!-- chatbox.component.html -->
<div>
    <!-- Chatbox Toggle Button -->

    <button (click)="toggleChatbox()" type="button" class=" bottom-4 right-16 fixed md:bottom-4 md:right-4 p-3 border border-cyan-300 text-cyan-300 bg-stone-900 hover:bg-[#050708]/80 focus:ring-4 focus:outline-none focus:ring-[#050708]/50 font-medium rounded-lg text-sm px-5 py-3 text-center inline-flex items-center dark:hover:bg-[#050708]/40 dark:focus:ring-gray-600 me-2 mb-2">
        <lord-icon class="w-6 h-6 me-2 -ms-1" trigger="loop" src="assets/smile.json" id="myLottieIcon"> </lord-icon>
        Ask a Question 

        <svg *ngIf="!isChatboxVisible" class="w-6 h-6 text-cyan-300 dark:text-white ml-12 " aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m5 15 7-7 7 7"/>
          </svg>

          <svg *ngIf="isChatboxVisible" class="w-6 h-6 text-cyan-300 dark:text-white ml-12" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m19 9-7 7-7-7"/>
          </svg>
          
          
        </button>
  
    <!-- Chatbox -->
    <div *ngIf="isChatboxVisible" 
     class="fixed bottom-24 right-8 md:bottom-20 md:right-4 border border-cyan-300 w-80 h-96 bg-stone-900 rounded-lg shadow-lg flex flex-col">
  
  <div class="bg-stone-900 border border-cyan-300 text-gray-200 p-4 flex justify-between items-center rounded-t-lg">
    <h4>ChatBot</h4>
    <button (click)="closeChatbox()" class="text-xl">&times;</button>
  </div>

  <div class="flex-1 p-4 overflow-y-auto text-gray-400">
    <div *ngFor="let chat of chatMessages" class="chat-message">
      <p><span class="text-gray-300"><strong>{{chat.sender}}:</strong></span> {{chat.message}}</p>
    </div>
  </div>

  <div class="p-4">
    <input type="text" 
           [(ngModel)]="message" 
           (keyup.enter)="sendMessage()" 
           class="w-full p-2 border border-cyan-300 bg-stone-900 text-gray-300 rounded" 
           placeholder="Type a message...">
  </div>
</div>

  </div>
