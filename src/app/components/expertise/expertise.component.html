<div id="expertise" class="bg-[#0c0a09] pt-28 pb-20 relative overflow-hidden">

  <!-- Background Decor -->
  <div
    class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] bg-cyan-900/10 rounded-full blur-[150px] pointer-events-none">
  </div>

  <div class="container mx-auto px-6 relative z-10">

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-12">

      <!-- Title Section (Left or Top) -->
      <div class="lg:col-span-4 flex flex-col justify-center text-center lg:text-left">
        <h5 class="text-cyan-400 font-outfit font-bold text-sm tracking-widest uppercase mb-3">Services</h5>
        <h2 class="text-3xl md:text-5xl font-bold text-white font-outfit mb-4 leading-tight">
          WHAT <br> <span class="text-gray-700">I OFFER</span>
        </h2>
        <p class="text-gray-400 text-base font-inter font-light max-w-md mx-auto lg:mx-0">
          Crafting high-performance digital experiences with cutting-edge technologies.
        </p>
        <div class="mt-8 hidden lg:block">
          <div
            class="w-12 h-12 rounded-full border border-cyan-500/30 flex items-center justify-center animate-spin-slow">
            <svg class="w-8 h-8 text-cyan-500" fill="none" viewBox="0 0 24 24">
              <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M19 14l-7 7m0 0l-7-7m7 7V3"></path>
            </svg>
          </div>
        </div>
      </div>

      <!-- Services Grid -->
      <div class="lg:col-span-8">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

          <div *ngFor="let offer of offers; let i = index" #workItem
            class="group relative p-8 bg-white/5 border border-white/5 rounded-2xl hover:bg-cyan-900/20 hover:border-cyan-500/30 transition-all duration-300">

            <div
              class="absolute top-4 right-4 text-2xl font-bold text-white/5 group-hover:text-cyan-500/20 font-outfit transition-colors">
              0{{ i + 1 }}
            </div>

            <h3 class="text-xl text-white font-bold font-outfit mb-3 group-hover:text-cyan-400 transition-colors">
              {{ offer.title }}</h3>

            <p class="text-gray-400 text-base font-inter font-light mb-6 group-hover:text-gray-200 transition-colors">
              {{ offer.description }}
            </p>

            <div
              class="w-8 h-1 bg-cyan-800 group-hover:w-full group-hover:bg-cyan-400 transition-all duration-500 rounded-full">
            </div>
          </div>

        </div>
      </div>

    </div>

  </div>
</div>
