<nav *ngIf="!isLoading"
  class="fixed top-0 left-0 w-full z-50 transition-all duration-300 bg-black/10 backdrop-blur-md border-b border-white/5">
  <div class="max-w-screen-xl flex flex-wrap items-center justify-between mx-auto px-6 py-4">

    <!-- Modern Logo Branding -->
    <a (click)="scrollToSection('profile')" routerLink="/profile" class="flex items-center group cursor-pointer">
      <span class="text-2xl md:text-3xl font-bold text-white font-outfit tracking-tighter">
        sHAbEel<span class="text-cyan-400">.</span>
      </span>
    </a>

    <!-- Mobile Menu Button -->
    <button type="button"
      class="inline-flex items-center p-2 w-10 h-10 justify-center text-gray-400 rounded-xl md:hidden hover:bg-white/5 focus:outline-none transition-colors"
      (click)="toggleNavbar()">
      <span class="sr-only">Open main menu</span>
      <svg class="w-6 h-6" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 17 14">
        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          [attr.d]="isNavbarOpen ? 'M1 1l15 15M1 16L16 1' : 'M1 1h15M1 7h15M1 13h15'" />
      </svg>
    </button>

    <!-- Navigation Links -->
    <div [ngClass]="{ hidden: !isNavbarOpen, block: isNavbarOpen }" class="w-full md:block md:w-auto">
      <ul
        class="font-medium flex flex-col p-4 md:p-0 mt-4 md:flex-row md:space-x-10 rtl:space-x-reverse md:mt-0 bg-white/5 md:bg-transparent rounded-2xl md:rounded-none backdrop-blur-lg md:backdrop-blur-0 border border-white/5 md:border-0">
        <li *ngFor="let link of [
          {id: 'skills', label: 'About Me'},
          {id: 'works', label: 'Works'},
          {id: 'expertise', label: 'What I Offer'},
          {id: 'contact', label: 'Contact'}
        ]">
          <a (click)="scrollToSection(link.id)" (mouseenter)="vibrate($event)"
            class="nav-link block py-3 px-4 md:p-0 text-gray-400 hover:text-cyan-400 font-outfit text-sm md:text-[13px] font-medium tracking-widest uppercase transition-all duration-300 cursor-pointer relative group/item">
            {{ link.label }}
            <span
              class="absolute -bottom-1 left-0 w-0 h-[1px] bg-cyan-500 transition-all duration-300 group-hover/item:w-full opacity-0 group-hover/item:opacity-100 shadow-[0_0_8px_rgba(6,182,212,1)]"></span>
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>
