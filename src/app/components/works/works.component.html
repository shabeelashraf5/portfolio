<div
  class="min-h-screen bg-stone-900 flex flex-col items-center justify-center"
>
  <div class="text-center md:mt-20 lg:mt-20 mt-12">
    <h5
      class="mb-2 md:text-5xl text-3xl font-bold tracking-tight text-cyan-300 dark:text-white saira-condensed-semibold"
    >
      My Works
    </h5>
  </div>

  <div class="w-full relative">
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 p-4">
      <div
        #workItem
        *ngFor="let item of items; let i = index"
        class="max-w-sm mx-auto bg-stone-900 border border-cyan-300 rounded-3xl shadow-lg dark:bg-gray-800 dark:border-gray-700 relative"
      >
        <!-- Ribbon for specific item -->
        <div *ngIf="item.sl === 1" class="absolute right-0 top-60 h-16 w-16">
          <div
            class="absolute transform rotate-45 bg-green-600 text-center text-white font-semibold py-1 right-[-35px] top-[32px] w-[170px]"
          >
            Coding in progress
          </div>
        </div>

        <a>
          <img
            class="rounded-t-3xl w-full h-48 object-cover transition-transform duration-300 transform hover:scale-110 opacity-70"
            [src]="item.imageUrl"
            alt=""
          />
        </a>
        <div class="p-5">
          <a>
            <h5
              class="mb-2 text-xl md:text-2xl font-bold tracking-tight text-center text-cyan-300 dark:text-white saira-condensed-semibold"
            >
              {{ item.title }}
            </h5>
          </a>
          <div class="mb-3 flex flex-wrap gap-2">
            <ng-container *ngFor="let keyword of item.description">
              <button
                type="button"
                class="px-3 py-1 text-gray-400 bg-transparent border border-cyan-300 rounded-full text-sm focus:ring-4 focus:outline-none focus:ring-blue-300 dark:border-blue-500 dark:text-blue-500 dark:focus:ring-blue-800"
              >
                {{ keyword }}
              </button>
            </ng-container>
          </div>
          <div class="flex justify-center items-center">
            <a [href]="item.link" target="_blank" rel="noopener noreferrer">
              <button
                type="button"
                class="mtext-blue-700 border border-cyan-300 hover:bg-gray-100 hover:text-white focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-full text-sm p-2.5 inline-flex items-center dark:border-blue-500 dark:text-blue-500 dark:hover:text-white dark:focus:ring-blue-800 dark:hover:bg-blue-500"
              >
                <svg
                  class="w-6 h-6 text-cyan-300"
                  aria-hidden="true"
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  fill="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    fill-rule="evenodd"
                    d="M12.006 2a9.847 9.847 0 0 0-6.484 2.44 10.32 10.32 0 0 0-3.393 6.17 10.48 10.48 0 0 0 1.317 6.955 10.045 10.045 0 0 0 5.4 4.418c.504.095.683-.223.683-.494 0-.245-.01-1.052-.014-1.908-2.78.62-3.366-1.21-3.366-1.21a2.711 2.711 0 0 0-1.11-1.5c-.907-.637.07-.621.07-.621.317.044.62.163.885.346.266.183.487.426.647.71.135.253.318.476.538.655a2.079 2.079 0 0 0 2.37.196c.045-.52.27-1.006.635-1.37-2.219-.259-4.554-1.138-4.554-5.07a4.022 4.022 0 0 1 1.031-2.75 3.77 3.77 0 0 1 .096-2.713s.839-.275 2.749 1.05a9.26 9.26 0 0 1 5.004 0c1.906-1.325 2.74-1.05 2.74-1.05.37.858.406 1.828.101 2.713a4.017 4.017 0 0 1 1.029 2.75c0 3.939-2.339 4.805-4.564 5.058a2.471 2.471 0 0 1 .679 1.897c0 1.372-.012 2.477-.012 2.814 0 .272.18.592.687.492a10.05 10.05 0 0 0 5.388-4.421 10.473 10.473 0 0 0 1.313-6.948 10.32 10.32 0 0 0-3.39-6.165A9.847 9.847 0 0 0 12.007 2Z"
                    clip-rule="evenodd"
                  />
                </svg>
              </button>
            </a>

            <a target="_blank" rel="noopener noreferrer">
              <button
                (click)="toggleModal(i)"
                type="button"
                class="mtext-blue-700 border border-cyan-300 ml-2 hover:bg-gray-100 hover:text-white focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-full text-sm p-2.5 inline-flex items-center dark:border-blue-500 dark:text-blue-500 dark:hover:text-white dark:focus:ring-blue-800 dark:hover:bg-blue-500"
              >
                <svg
                  class="w-6 h-6 text-cyan-300"
                  aria-hidden="true"
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  fill="none"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M13.213 9.787a3.391 3.391 0 0 0-4.795 0l-3.425 3.426a3.39 3.39 0 0 0 4.795 4.794l.321-.304m-.321-4.49a3.39 3.39 0 0 0 4.795 0l3.424-3.426a3.39 3.39 0 0 0-4.794-4.795l-1.028.961"
                  />
                </svg>
              </button>

              <!-- Small Modal -->
              <div
                [class.hidden]="!isModalOpen[i]"
                [attr.aria-hidden]="!isModalOpen[i]"
                [attr.inert]="!isModalOpen[i] ? true : null"
                id="small-modal-{{ i }}"
                tabindex="-1"
                class="fixed top-0 left-0 right-0 z-50 hidden w-full p-4 overflow-x-hidden overflow-y-auto md:inset-0 h-[calc(100%-1rem)] max-h-full"
              >
                <div class="relative w-full max-w-md max-h-full">
                  <!-- Modal content -->
                  <div
                    class="relative bg-stone-900 rounded-lg border border-cyan-300 shadow"
                  >
                    <!-- Modal header -->
                    <div
                      class="flex items-center justify-between p-4 md:p-5 border-b rounded-t border-cyan-300"
                    >
                      <h3
                        class="text-2xl font-medium text-cyan-300 saira-condensed-semibold"
                      >
                        {{ items[i].title }}
                      </h3>
                      <button
                        (click)="closeDialog(i)"
                        type="button"
                        class="text-gray-400 bg-transparent hover:bg-cyan-300 hover:text-gray-900 rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center dark:hover:bg-gray-600 dark:hover:text-white"
                      >
                        <svg
                          class="w-3 h-3"
                          aria-hidden="true"
                          xmlns="http://www.w3.org/2000/svg"
                          fill="none"
                          viewBox="0 0 14 14"
                        >
                          <path
                            stroke="currentColor"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"
                          />
                        </svg>
                        <span class="sr-only">Close modal</span>
                      </button>
                    </div>
                    <!-- Modal body -->
                    <div class="p-4 md:p-5 space-y-4">
                      <p
                        class="text-xl leading-relaxed text-gray-400 saira-condensed-semibold"
                      >
                        {{ items[i].demo }}
                      </p>
                    </div>
                  </div>
                </div>
              </div>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
