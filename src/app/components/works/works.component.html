<div id="works" class="min-h-screen bg-[#0c0a09] pt-28 pb-20 relative overflow-hidden">

  <!-- Unique Background Atmosphere for Works -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <div class="absolute top-1/4 right-0 w-[500px] h-[500px] bg-cyan-900/10 rounded-full blur-[120px] opacity-30"></div>
    <div class="absolute bottom-1/4 left-0 w-[500px] h-[500px] bg-blue-900/10 rounded-full blur-[120px] opacity-30">
    </div>
  </div>

  <div class="container mx-auto px-6 relative z-10">

    <!-- Centered Header (Differentiates from Expertise split layout) -->
    <div class="max-w-3xl mx-auto text-center mb-20 animate-fade-in-up">
      <h5 class="text-cyan-400 font-outfit font-bold text-xs tracking-[0.4em] uppercase mb-4">Portfolio</h5>
      <h2 class="text-3xl md:text-5xl font-bold text-white font-outfit mb-6 tracking-tight">
        SELECTED <span class="gradient-text">PROJECTS</span>
      </h2>
      <div class="w-12 h-1 bg-cyan-500 mx-auto rounded-full mb-6"></div>
      <p class="text-gray-400 text-base md:text-lg font-inter font-light leading-relaxed">
        Showcasing a range of professional applications built with a focus on performance, scalability, and user
        experience.
      </p>
    </div>

    <!-- 3-Column Grid (Differentiates from Expertise 2-column grid) -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">

      <div *ngFor="let item of items; let i = index" #workItem
        class="group relative flex flex-col h-full bg-[#121212] border border-white/5 p-7 rounded-2xl hover:border-cyan-500/30 transition-all duration-500 transform hover:-translate-y-2">

        <!-- Centric Glow Effect Container -->
        <div
          class="absolute inset-0 bg-cyan-500/0 group-hover:bg-cyan-500/[0.03] rounded-2xl transition-all duration-500">
        </div>

        <div class="relative z-10 flex flex-col h-full">
          <!-- Small Rounded Thumbnail (Visual Identity) -->
          <div
            class="w-14 h-14 rounded-xl overflow-hidden mb-6 border border-white/10 group-hover:border-cyan-500/50 transition-all duration-500 shrink-0">
            <img [src]="item.imageUrl" [alt]="item.title" class="w-full h-full object-cover">
          </div>

          <!-- Project Numbering (Subtle, top-right) -->
          <div
            class="absolute top-0 right-0 text-xl font-bold text-white/5 group-hover:text-cyan-500/10 font-outfit transition-colors">
            P-0{{ i + 1 }}
          </div>

          <!-- Status Badge (Fixed height to prevent alignment issues) -->
          <div class="h-6 mb-2">
            <div *ngIf="item.status">
              <span
                class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full bg-yellow-500/10 border border-yellow-500/20 text-yellow-500 text-[9px] font-bold uppercase tracking-wider">
                <span class="w-1 h-1 rounded-full bg-yellow-500 animate-pulse"></span>
                {{ item.status }}
              </span>
            </div>
          </div>

          <h3 class="text-xl text-white font-bold font-outfit mb-3 group-hover:text-cyan-400 transition-colors">
            {{ item.title }}
          </h3>

          <!-- Tech Pill Badges -->
          <div class="flex flex-wrap gap-2 mb-8">
            <span *ngFor="let tech of item.description.slice(0, 3)"
              class="px-2.5 py-1 text-[10px] bg-cyan-500/5 border border-cyan-500/20 text-cyan-400/80 rounded-full font-medium tracking-wide">
              {{ tech }}
            </span>
          </div>

          <!-- Differentiated Action Layout - Pushed to Bottom -->
          <div class="flex items-center justify-between mt-auto pt-4 border-t border-white/5">
            <div class="flex items-center gap-3">
              <a [href]="item.link" target="_blank"
                class="w-9 h-9 flex items-center justify-center bg-white/5 rounded-lg hover:bg-cyan-500/20 hover:text-cyan-400 transition-all text-gray-500"
                title="View Code">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path>
                </svg>
              </a>
              <button (click)="toggleModal(i)"
                class="w-9 h-9 flex items-center justify-center bg-white/5 rounded-lg hover:bg-green-500/20 hover:text-green-400 transition-all text-gray-500"
                title="Live Preview">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                </svg>
              </button>
            </div>

            <button (click)="toggleVideo(i)"
              class="group/btn flex items-center gap-2 text-[10px] font-bold text-gray-500 hover:text-white transition-all tracking-[0.1em] uppercase">
              <span>View Case</span>
              <svg class="w-3 h-3 transform group-hover/btn:translate-x-1 transition-transform" fill="none"
                stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3">
                </path>
              </svg>
            </button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Video Modal Override -->
  <div *ngFor="let item of items; let i = index">
    <div *ngIf="isVideoOpen[i]"
      class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/95 backdrop-blur-md transition-opacity"
      (click)="closeDialogVideo(i)">
      <div class="relative bg-[#0c0a09] w-full max-w-lg rounded-3xl border border-white/10 shadow-2xl p-10 text-center"
        (click)="$event.stopPropagation()">
        <h3 class="text-xl text-white font-bold mb-4 font-outfit">{{ item.title }} - Demo</h3>
        <p class="text-gray-400 text-sm mb-10 font-inter leading-relaxed">{{ item.video }}</p>
        <button (click)="closeDialogVideo(i)"
          class="w-full py-3 bg-white/5 hover:bg-cyan-500/20 border border-white/10 hover:border-cyan-500/50 text-white rounded-xl transition-all font-outfit text-xs uppercase tracking-widest font-bold">
          Close Window
        </button>
      </div>
    </div>
  </div>

  <!-- Live Link Modal Override -->
  <div *ngFor="let item of items; let i = index">
    <div *ngIf="islinkOpen[i]"
      class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/95 backdrop-blur-md transition-opacity"
      (click)="closeDialogLink(i)">
      <div class="relative bg-[#0c0a09] w-full max-w-lg rounded-3xl border border-white/10 shadow-2xl p-10 text-center"
        (click)="$event.stopPropagation()">
        <h3 class="text-xl text-white font-bold mb-4 font-outfit">Live Preview</h3>
        <p class="text-gray-400 text-sm mb-10 font-inter leading-relaxed">{{ item.demo }}</p>
        <button (click)="closeDialogLink(i)"
          class="w-full py-3 bg-white/5 hover:bg-green-500/20 border border-white/10 hover:border-green-500/50 text-white rounded-xl transition-all font-outfit text-xs uppercase tracking-widest font-bold">
          Close Preview
        </button>
      </div>
    </div>
  </div>

</div>
